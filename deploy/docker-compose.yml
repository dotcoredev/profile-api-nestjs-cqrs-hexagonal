services:
  profile_api:
    image: ${PROFILE_API_IMAGE}
    container_name: profile_api
    restart: unless-stopped
    env_file:
      - /var/nicode/env/production.env
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s