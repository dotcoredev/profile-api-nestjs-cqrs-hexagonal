name: Deploy Profile API

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: profile-api-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PROFILE_API_IMAGE: ghcr.io/dotcoredev/profile_api

jobs:
  # =========================================================
  # CHECK CHANGED FILES
  # =========================================================
  changes:
    name: Detect changes
    runs-on: ubuntu-latest

    outputs:
      api: ${{ steps.filter.outputs.api }}
      infra: ${{ steps.filter.outputs.infra }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/gateway/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.dockerignore'

            infra:
              - 'deploy/**'
              - '.github/workflows/deploy.yml'

  # =========================================================
  # BUILD PROFILE API
  # =========================================================
  build:
    name: Build Profile API
    runs-on: ubuntu-latest

    needs:
      - changes

    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.api == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/gateway/Dockerfile

          push: true

          tags: |
            ${{ env.PROFILE_API_IMAGE }}:latest
            ${{ env.PROFILE_API_IMAGE }}:${{ github.sha }}

          cache-from: type=gha,scope=profile_api
          cache-to: type=gha,mode=max,scope=profile_api